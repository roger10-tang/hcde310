<!doctype html>
<html lang="en">
<head>
  <title>Search results</title>
</head>
<body>
  <h1>Results for {{ keyword }}</h1>
  <ul>
    {% for artwork in artworks %}
      <li>{{ artwork.get("title") or "Unknown title" }} - {{ artwork.get("artist_title") or "Unknown artist" }} ({{ artwork.get("date_display") or "Unknown date" }})</li>
    {% endfor %}
  </ul>
  <a href="/">Back to search</a>
</body>
</html>
